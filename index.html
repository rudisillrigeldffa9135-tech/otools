<!doctype html>
<html build-time="%BUILD_TIME%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%PUBLIC_BASE%static/pwa/favicon-48.png" type="image/png" />
    <!-- PWA：可安装到桌面 / 主屏幕，见 vite-plugins/pwa.ts -->
    <link rel="manifest" href="%PUBLIC_BASE%manifest.webmanifest" />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="%PUBLIC_BASE%static/pwa/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_APP_TITLE%" />
    <!-- 不用内联脚本动态写 viewport：站点开启了 CSP，静态写法在不支持 viewport-fit 的浏览器上会被忽略，效果相同 -->
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
    <title>%VITE_APP_TITLE%</title>
    <!--preload-links-->
    <!--app-context-->
  </head>

  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
